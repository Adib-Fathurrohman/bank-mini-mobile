# Push a tag like v1.0.0 to build a signed Android APK and publish it on the
# Releases page. Signing secrets: DEPLOY.md, "Android releases".
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - run: npm ci
      - run: npm run typecheck

      # Native project from app.json (android/ is not committed). The release build
      # embeds the JavaScript and calls https://bank.rumput.tech/api.
      - run: npx expo prebuild --platform android --no-install

      - name: Build
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Sign with the release key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set (see DEPLOY.md)."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > release.keystore
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BUILD_TOOLS/zipalign" -f -p 4 android/app/build/outputs/apk/release/app-release.apk aligned.apk
          "$BUILD_TOOLS/apksigner" sign --ks release.keystore --ks-pass env:KEYSTORE_PASSWORD \
            --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASSWORD \
            --out "bank-mini-${GITHUB_REF_NAME}.apk" aligned.apk
          "$BUILD_TOOLS/apksigner" verify "bank-mini-${GITHUB_REF_NAME}.apk"
          rm release.keystore

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "bank-mini-${GITHUB_REF_NAME}.apk" --title "Bank Mini ${GITHUB_REF_NAME}" --generate-notes
